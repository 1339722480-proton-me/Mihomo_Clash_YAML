# ███████████████████████████ 规则匹配 ███████████████████████████
rules:
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,cn_domain),(RULE-SET,cn_ip,no-resolve)))))),REJECT
  - DOMAIN-SUFFIX,adobe_domain,REJECT                                  # Adobe和谐版检测
  - RULE-SET,custom_domain_direct,国内直连                              # 自定义直连域名
  - RULE-SET,custom_domain_proxy,一键代理                               # 自定义代理域名
  - RULE-SET,private_domain,国内直连                                    # Private
  - RULE-SET,private_ip,国内直连,no-resolve                             # Private
  - RULE-SET,games@cn_domain,国内直连                                   # 游戏直连 
  - RULE-SET,ai-!cn_domain,AI                                           # AI(国际)
  - RULE-SET,youtube_domain,YouTube                                     # YouTube
  - RULE-SET,google_domain,Google                                       # Google
  - RULE-SET,github_domain,GitHub                                       # GitHub
  - RULE-SET,onedrive_domain,OneDrive                                   # OneDrive
  - RULE-SET,microsoft_domain,Microsoft                                 # 微软服务
  - RULE-SET,apple_domain,Apple                                         # 苹果服务
  - RULE-SET,steam_domain,Steam                                         # Steam
  - RULE-SET,tiktok_domain,TikTok                                       # TikTok
  - RULE-SET,twitter_domain,Twitter(X)                                  # Twitter(X)
  - RULE-SET,telegram_domain,Telegram                                   # Telegram
  - RULE-SET,netflix_domain,Netflix                                     # Netflix
  - RULE-SET,disney_domain,Disney                                       # Disney+
  - RULE-SET,spotify_domain,Spotify                                     # Spotify
  - RULE-SET,paypal_domain,PayPal                                       # PayPal
  - RULE-SET,speedtest_domain,Speedtest                                 # Speedtest
  - RULE-SET,google_ip,Google,no-resolve                                # Google
  - RULE-SET,telegram_ip,Telegram,no-resolve                            # Telegram
  - RULE-SET,twitter_ip,Twitter(X),no-resolve                           # Twitter
  - RULE-SET,netflix_ip,Netflix,no-resolve                              # Netflix
  - RULE-SET,geolocation-!cn,一键代理                                    # 排除国内
  - RULE-SET,add_cn_domain,国内直连                                      # 直连域名
  - RULE-SET,cn_domain,国内直连                                          # 中国域名
  - RULE-SET,cn_ip,国内直连,no-resolve                                   # 中国IP
  - MATCH,漏网之鱼                                                       # 兜底规则



