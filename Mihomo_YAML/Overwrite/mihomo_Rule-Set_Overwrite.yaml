# ███████████████████████████ 锚点区域 ███████████████████████████
# ══ 出站锚点 ══
Anchor_Proxy: &Anchor_Proxy {type: select, proxies: [香港-自动, 日本-自动, 美国-自动, 英国-自动, 香港-手动, 日本-手动, 美国-手动, 英国-手动, 国内直连]}
Anchor_AI: &Anchor_AI {type: select, proxies: [家宽-自动, 家宽-手动, 美国-自动, 美国-手动]}
Anchor_Local-Direct: &Anchor_Local-Direct {type: select, proxies: [一键代理, 香港-自动, 日本-自动, 美国-自动, 英国-自动, 香港-手动, 日本-手动, 美国-手动, 英国-手动, 国内直连]}
Anchor_Direct: &Anchor_Direct {type: select, proxies: [DIRECT], hidden: true}
# ══ 策略组锚点 ══
Anchor_SD: &Anchor_SD {type: select, empty-fallback: REJECT, include-all: true}
Anchor_FallBack: &Anchor_FallBack {type: fallback, empty-fallback: REJECT, interval: 300, lazy: false, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204'}
Anchor_URL: &Anchor_URL {type: url-test, empty-fallback: REJECT, interval: 300, lazy: false, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', tolerance: 50, include-all: true}
# ══ 规则集锚点 ══
Anchor_Domain: &Anchor_Domain {type: http, interval: 86400, behavior: domain, format: mrs}
Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs}
Anchor_Classical: &Anchor_Classical {type: http, interval: 86400, behavior: classical, format: text}
Anchor_Domain_Text: &Anchor_Domain_Text {type: http, interval: 86400, behavior: domain, format: text}
# ══ 区域筛选锚点 ══
Anchor_HK: &Anchor_HK '(?i)^(?!.*Landing)(?=.*(香港|(?<![a-zA-Z])(hk|hkg)(?![a-zA-Z])|hongkong|hong kong|🇭🇰)).*$'
Anchor_JP: &Anchor_JP '(?i)^(?!.*Landing)(?=.*(日本|(?<![a-zA-Z])(jp|nrt|hnd|kix|cts|fuk)(?![a-zA-Z])|japan|tokyo|🇯🇵)).*$'
Anchor_US: &Anchor_US '(?i)^(?!.*Landing)(?=.*(美国|(?<![a-zA-Z])(us|usa|lax|sfo|jfk|sjc)(?![a-zA-Z])|america|united states|🇺🇸)).*$'
Anchor_GB: &Anchor_GB '(?i)^(?!.*Landing)(?=.*(英国|(?<![a-zA-Z])(gb|uk|lhr|lgw|man|stn|ltn|bhx)(?![a-zA-Z])|britain|united kingdom|england|🇬🇧)).*$'
Anchor_Residential_IP: &Anchor_Residential_IP '(?i)^(?=.*Landing).*$'
# ══ 图标锚点 ══
Anchor_icon_Auto: &Anchor_icon_Auto "https://raw.githubusercontent.com/1339722480-proton-me/HOMOMIX/main/Icon/Color/Large/Auto_Link.png"


# ███████████████████████████ 核心配置 ███████████████████████████
# ══ 基础配置 ══
mode: rule
ipv6: true
mixed-port: 7890
allow-lan: true
bind-address: "*"
log-level: warning
unified-delay: true
tcp-concurrent: true
global-ua: clash.meta
keep-alive-idle: 600
keep-alive-interval: 15
profile: { store-selected: true, store-fake-ip: true }

# ══ 管理面板 ══
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 0.0.0.0:9090
external-ui-name: zashboard
external-ui: ui
secret: ""

# ══ 核心地理/规则数据库文件 ══
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# ══ TUN配置 ══
tun:
  enable: true
  stack: mixed
  dns-hijack: [udp://any:53, tcp://any:53]
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false
  endpoint-independent-nat: true
  route-exclude-address-set: [cn_ip]

# ══ 嗅探功能 ══
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    QUIC: { ports: [443] }
    TLS:  { ports: [443, 8443] }
    HTTP: { ports: [80, 8080-8880], override-destination: true }
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
    - "+.tiktok.com"
  skip-domain:
    - "rule-set:private_domain,cn_domain"
    - "dlg.io.mi.com"
    - "+.mi.com"
    - "+.xiaomi.com"
    - "+.miwifi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"

# ══ hosts配置 ══
hosts:
  'services.googleapis.cn': ['services.googleapis.com']

# ══ DNS配置 ══
dns:
  enable: true
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter-mode: blacklist
  respect-rules: true
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "rule-set:fakeipfilter_cn"
    - "rule-set:fakeipfilter_!cn"
    - "rule-set:add_cn_domain"
    - "rule-set:cn_domain"
    - "rule-set:microsoftcn_domain"
    - "rule-set:applecn_domain"
    - "rule-set:steamcn_domain"
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:fakeipfilter_!cn":
    - https://8.8.8.8/dns-query
  nameserver:
    - https://8.8.8.8/dns-query
  fallback:
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN


