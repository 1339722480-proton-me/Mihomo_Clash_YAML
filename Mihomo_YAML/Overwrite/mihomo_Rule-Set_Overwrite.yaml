# 名称： Seven1_fallback_Rule-Set  （Seven1echo）
# 版本： V2026.10.7
# 频道： mihomo当前版本理论上较完美的分流准确同时防泄露专业版本（nikki，openclash等官方内核的都可以跑）；因为DNS流程较多，尽可能用本地搭建DNS开启乐观缓存。
# Google应用商店： 因为配置里开启了绕过大陆，google商店会无法更新，可以尝试把 "+.googleapis.cn"  "+.xn--ngstr-lra8j.com" 两个域名后缀指定走国外DNS，同时rules里添加走代理，理论上可以解决，或者关闭绕过大陆。
# 说明： ①使用前需补充完整 “订阅链接” 与 “机场名”，可将 “nameserver” 修改为运营商提供的 DNS 地址; ②已隐藏“区域-故转”、“区域-自动”这两个策略组，使用时按需手动选取对应地区策略组即可。



# ███████████████████████████ 锚点区域 ███████████████████████████
# ══ 订阅锚点 ══
Anchor_Subscribe: &Anchor_Subscribe {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)).*$"}
# ══ 出站锚点 ══
Anchor_Proxy: &Anchor_Proxy {type: select, proxies: [香港-自动, 日本-自动, 美国-自动, 英国-自动, 香港-手动, 日本-手动, 美国-手动, 英国-手动, 国内直连]}
Anchor_AI: &Anchor_AI {type: select, proxies: [家宽-自动, 家宽-手动, 美国-自动, 美国-手动,]}
Anchor_Local-Direct: &Anchor_Local-Direct {type: select, proxies: [一键代理, 香港-自动, 日本-自动, 美国-自动, 英国-自动, 香港-手动, 日本-手动, 美国-手动, 英国-手动, 国内直连]}
Anchor_Direct: &Anchor_Direct {type: select, proxies: [DIRECT], hidden: true}
# ══ 策略组锚点 ══
Anchor_SD: &Anchor_SD {type: select, empty-fallback: REJECT, include-all: true}
Anchor_FallBack: &Anchor_FallBack {type: fallback, empty-fallback: REJECT, interval: 300, lazy: false, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204'}
Anchor_URL: &Anchor_URL {type: url-test, empty-fallback: REJECT, interval: 300, lazy: false, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', tolerance: 50, include-all: true}
# ══ 规则集锚点 ══
Anchor_Domain: &Anchor_Domain {type: http, interval: 86400, behavior: domain, format: mrs}
Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs}
Anchor_Classical: &Anchor_Classical {type: http, interval: 86400, behavior: classical, format: text}
Anchor_Domain_Text: &Anchor_Domain_Text {type: http, interval: 86400, behavior: domain, format: text}
# ══ 区域筛选锚点 ══
